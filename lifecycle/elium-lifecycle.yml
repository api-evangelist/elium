versioning:
  scheme: none-published
  current: null
  detail: >-
    Elium publishes no API version policy. There is no URI version segment, no version header and no
    date-pinned version; the only version token in the whole surface is the OAuth scope name "apiv1".
    Schema changes are communicated only as per-field Deprecated markers in the GraphQL reference.
  docs: https://learn.elium.com/en/api/
deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  detail: >-
    No deprecation policy, no notice period, and no RFC 8594 Sunset/Deprecation header support is
    documented. Five operations carry a Deprecated marker in the published GraphQL reference, with no
    stated removal date. No Deprecation pointer is wired in apis.yml because there is no policy page to
    point at - only individual deprecated fields.
