gaps:
- No API-specific changelog or release notes - the single published changelog is product-level.
- No deprecation policy or sunset signalling, so a consumer of the five deprecated operations has no
  notice window.
- No published API versioning strategy at all, which for a GraphQL API leaves field removal as the only
  observable breaking-change signal.
