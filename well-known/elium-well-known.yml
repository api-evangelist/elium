result: no-hit
result_note: >-
  Elium serves NO /.well-known/ discovery document of its own. Every path on elium.com and api.elium.com
  returned 404. Two 200s were observed and BOTH are false positives, recorded here so a later round does
  not credit them: learn.elium.com answers 200 with the same HTML documentation shell for every
  /.well-known/* path (an SPA/docs catch-all, not a document), and the one real 200 - a text/plain
  security.txt on help.elium.com - belongs to Intercom, the third party that hosts Elium's help centre
  (its own Canonical field says https://app.intercom.com/.well-known/security.txt and its contacts are
  bugcrowd.com/intercom and security@intercom.com). No WellKnown or SecurityTxt pointer is wired in
  apis.yml, because neither surface is Elium's.
