cross_cutting_rules_every_skill_carries:
- The endpoint is per tenant - https://{platform}.elium.com/... There is no shared vendor host and a tenant
  name must never be guessed.
- The API and the MCP server are Enterprise-plan only; Team and Corporate cannot call them.
- OAuth 2.0 bearer, one scope (apiv1), 3600-second access tokens, no API keys.
- HTTP 200 is not success - handled errors are in-band (top-level GraphQL errors, or
  data.<mutation>.errors[] with __typename and path).
- There is NO idempotency mechanism, so no write may be blind-retried; verify the effect first.
- No rate limits and no rate-limit response headers are published - throttling is unobservable.
- Everything is evaluated with the token user's own permissions, so an empty result may mean "not
  permitted" rather than "not found".
