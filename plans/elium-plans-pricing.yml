api_access_finding: >-
  THE API IS A PAID-TIER FEATURE. Elium's pricing page lists "full API access" on Enterprise only, and its
  help centre states the GraphQL API is "available for all the Enterprise platform". Team and Corporate
  customers cannot call the GraphQL API or the MCP server at all. This is a commercial gate, not a
  technical one, and it is why no anonymous or trial-tier introspection of the contract is possible.
