controls:
  url: https://elium.com/trust/controls
  domains: [Physical Security, Network Security, Data Security, General Data Protection, Quality & Service,
    Reversibility, 'Backup & Recovery']
  highlights:
  - control: Encryption in transit
    detail: >-
      "All data transfers enforce a secure connection (HTTPS with TLS 1.3 or TLS 1.2, using strong cipher
      suites including AES-256-GCM and ChaCha20-Poly1305)."
  - control: Security audits
    detail: >-
      "Penetration tests are conducted regularly by independent third parties and vulnerability scans are
      automated. Findings are assessed and remediated per defined SLAs."
  - control: Incident management
    detail: >-
      Severity classification, coordinated response, customer notification, and "priority-based SLAs with
      defined acknowledgement and resolution targets"; every incident triggers a post-incident root-cause
      and lessons-learned review.
  - control: Enterprise SSO
    detail: >-
      "SAML2 and OpenID connectors are available for seamless enterprise SSO integration, including
      ADFS/Microsoft."
  - control: Support team access
    detail: >-
      Support access to a customer platform requires professional SSO, MFA and a time-limited random
      password, with an audit-trail notification to both the employee and the customer's administrators.
  - control: Availability
    detail: >-
      "The monthly uptime rate is guaranteed and monitored by an external service. Availability metrics are
      published and contractually committed."
  - control: Audit log
    detail: Administrative and security events are preserved in a tamper-evident audit log.
