aid: elium
name: Elium
description: >-
  Elium is a European enterprise knowledge-management SaaS platform, founded in 2007 as Knowledge Plaza and
  renamed Elium in 2017, headquartered in Louvain-la-Neuve, Belgium. Teams capture, validate and govern
  company knowledge as structured articles - which Elium calls "stories" - inside spaces, using templates,
  multi-step approval, expiration management, duplicate and gap detection, and in-place multilingual
  translation. The same governed corpus is then served to people and to AI agents through AI search, smart
  assistants, external portals and integrations. Programmatically Elium is a GraphQL provider, not a REST
  one: each customer platform serves its own per-tenant GraphQL endpoint with 17 queries, 206 mutations and
  18 subscriptions, documented in a fully published SpectaQL reference, secured with OAuth 2.0 on a single
  apiv1 scope. In June 2026 Elium added a per-tenant remote Model Context Protocol server exposing three
  read-only knowledge tools to ChatGPT, Claude and custom agents. API and MCP access are Enterprise-plan
  only. Elium is ISO/IEC 27001:2022 certified and SecNumCloud-qualified, with EU-default and sovereign
  French hosting options.
