- name: Elium MCP Server
  description: >-
    A remote Model Context Protocol server, announced 3 June 2026, served per tenant at
    https://{platform}.elium.com/services/mcp with OAuth 2.0 authorization and optional Dynamic Client
    Registration. Three published tools, all read-only - FindRelevantArticles (semantic search),
    FindSpecificArticles (filtered search) and ReadFullArticle - each running with the permissions of the
    authenticated user. Documented setup paths for ChatGPT and Claude. Enterprise plan only.
  humanURL: https://help.elium.com/en/articles/12767574-mcp
  baseURL: https://{platform}.elium.com/services/mcp
  tags:
  - MCP
