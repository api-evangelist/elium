apis:
- name: Elium GraphQL API
  description: >-
    Elium's single GraphQL endpoint, served per tenant at https://{platform}.elium.com/graphql. 17 queries,
    206 mutations and 18 subscriptions over 1128 type definitions, covering stories (content), spaces,
    users, templates/schemas, tags, comments, annotations, alerts, smart assistants and tenant
    administration. OAuth 2.0 bearer with one scope, apiv1. Relay cursor connections for pagination; errors
    are returned in-band on each mutation payload rather than as HTTP status codes. No OpenAPI is published
    - GraphQL is the contract. Enterprise plan only.
  humanURL: https://learn.elium.com/en/api/
  baseURL: https://{platform}.elium.com/graphql
  tags:
  - GraphQL
  - Knowledge Management
  - Enterprise Search
