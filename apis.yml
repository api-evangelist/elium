x-api-base:
  verdict: templated-by-design
  repair_tool_verdict: no-usable-base
  note: >-
    repair-api-bases.py reports "no-usable-base" because BOTH bases template the HOST, not just a path
    segment. That verdict is correct about the shape and wrong about the cause: Elium has no shared API
    host to record. It deploys one platform per subdomain and its own documentation uses placeholder tenant
    names throughout - my-platform.elium.com in the quick start, mycompany.elium.com in the token example,
    your-platform-name.elium.com in the MCP article. api.elium.com resolves but serves an application 404
    on every path, including every spec path probed, so it is not the base either. Leaving {platform} in
    place is the accurate record; substituting any concrete tenant would invent a customer's hostname. Do
    not "repair" this in a later round.
  evidence:
  - {url: 'https://api.elium.com/', status: 404}
  - {url: 'https://api.elium.com/openapi.json', status: 404}
  - {url: 'https://demo.elium.com/graphql', status: 404, method: POST}
  - {url: 'https://demo.elium.com/services/mcp', status: 404, method: POST}
  checked: '2026-08-17'
x-pointers-deliberately-absent:
  note: >-
    Recorded so a later round does not re-litigate these, and does not add a pointer the provider has not
    earned. Each was probed or searched in this pass.
  OpenAPI: >-
    None exists. Probed api.elium.com/openapi.json, /openapi.yaml, /swagger.json, /v1/openapi.json,
    /api-docs, /docs, /redoc plus the docs host - all 404. GraphQL is this provider's contract.
  AgentCard: >-
    /.well-known/agent-card.json and legacy /.well-known/agent.json probed on elium.com, api.elium.com,
    learn.elium.com and help.elium.com - 404 everywhere except learn.elium.com, which answers 200 with an
    HTML docs shell for every /.well-known/* path. No card, so per the pipeline contract no a2a/ artifact
    was authored.
  WellKnown: >-
    Elium serves no /.well-known/ document of its own. The probe is recorded in
    well-known/elium-well-known.yml with every status; no pointer, because a file documenting an absence
    must not be scored as a presence.
  SecurityTxt: >-
    Absent on elium.com and api.elium.com. The 200 text/plain security.txt on help.elium.com is INTERCOM's
    (Canonical app.intercom.com, contacts bugcrowd.com/intercom) because the help centre is Intercom-hosted.
  Idempotency: >-
    Elium has no idempotency mechanism. Searched all 206 mutations, 244 input types and the API guides for
    /idempoten/i - zero matches. Retrying storyPost creates a second story.
  SDKs: >-
    No client library in any language on npm, PyPI, RubyGems, Packagist, crates.io, pkg.go.dev, Maven or
    NuGet. The four first-party @eliumhq npm packages are internal build tooling, newest release 2020-01-15.
  Webhooks: >-
    No outbound webhooks are advertised. The event surface is 18 GraphQL subscriptions, recorded in
    asyncapi/elium-events.yml without an AsyncAPI or Webhooks pointer.
  AsyncAPI: No AsyncAPI document is published.
  Deprecation: >-
    Five operations carry a Deprecated marker in the reference, but there is no deprecation policy page, no
    notice period and no RFC 8594 Sunset support to point at.
  GitHubOrganization: >-
    github.com/elium and github.com/Elium belong to Molecule Science (molecule-science.com), a different
    company. Elium's own code is on GitLab at gitlab.com/elium/product, which returns 403 anonymously.
  Postman: www.postman.com/eliumhq returns only the Postman SPA shell - no public workspace or collection.
  Roadmap: elium.com/roadmap returns 404.
  CLI: No first-party CLI is published.
  Sandbox: >-
    No sandbox, test mode, or test-vs-live key separation is published. There is a free trial of the product
    but no developer test environment.
