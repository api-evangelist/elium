currency_finding: >-
  Every first-party package Elium has ever published to a public registry is internal build tooling, and
  the newest of the four was last released on 2020-01-15 - more than six years before this profile was
  written. None of them wraps the API. The MCP server Elium shipped in June 2026 is a remote endpoint with
  no companion package, so there is nothing on any registry that a developer or agent installs to reach
  Elium.
attribution_warning: >-
  The npm scope '@elium' (packages @elium/mighty, @elium/mighty-js, @elium/mighty-http-adapter and
  siblings, and the github.com/elium and github.com/Elium accounts) belongs to Molecule Science
  (molecule-science.com, Montpellier, France) - a different company that happens to use the name. Those
  packages are a TypeScript ORM and are NOT Elium's; they are deliberately excluded here. Elium's own code
  lives on GitLab (gitlab.com/elium/product, which returns 403 to anonymous requests), which is also why no
  GitHubOrganization pointer is wired in apis.yml.
